version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /pkg/config/dynamic/ext
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directories:
      - /
      - /docs
      - /webui
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
